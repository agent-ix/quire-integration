[licenses]
version = 2
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# Production checked views reach these existing transitive dependencies.
# Keep their additional permissive licenses scoped to the owning crates.
exceptions = [
    { name = "ar_archive_writer", allow = ["Apache-2.0 WITH LLVM-exception"] },
    { name = "borrow-or-share", allow = ["MIT-0"] },
]

[bans]
multiple-versions = "allow"
wildcards = "warn"

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[sources.allow-org]
github = ["agent-ix"]

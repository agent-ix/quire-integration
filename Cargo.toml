[package]
name = "quire-integration"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Version-locked composition and integration runtime for native Quire V1."
authors = ["Agent IX <agent@agent-ix.dev>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/quire-integration"
publish = false

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[lib]
name = "quire_integration"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
quire-specification = { package = "quire-specification-qualification", git = "https://github.com/agent-ix/quire-specification", branch = "main" }
# QSL-334: the composed QSL -> IR -> codegen tests live here, because nothing depends on
# this crate. Every first-party crate is `branch = "main"`, so each resolves to one copy.
quire-spec-language = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
qsl-foundation = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
qsl-replay = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
qsl-cst = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
qsl-eval = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
qsl-forms = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
qsl-package = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
qsl-route = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
qsl-semantics = { git = "https://github.com/agent-ix/quire-spec-language", branch = "main" }
quire-eval = { git = "https://github.com/agent-ix/quire-eval", branch = "main", default-features = false }
quire-checked = { git = "https://github.com/agent-ix/quire-eval", branch = "main", default-features = false }
quire-semantic-value = { git = "https://github.com/agent-ix/quire-semantic-value", branch = "main" }
quire-contract-ir = { package = "quire-contract-model", git = "https://github.com/agent-ix/quire-contract-ir", branch = "main" }
quire-contract-runtime = { git = "https://github.com/agent-ix/quire-contract-runtime", branch = "main", features = ["exact"] }
quire-contract-codegen = { git = "https://github.com/agent-ix/quire-contract-codegen", branch = "main" }
quire-driver = { git = "https://github.com/agent-ix/quire-driver", branch = "main" }
quire-exact = { git = "https://github.com/agent-ix/quire-exact", branch = "main", features = ["test-support"] }
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
